name: cingula_app
# Breve descripción para identificar el proyecto en la organizacion.
description: "Portales espacio-sonoros."
publish_to: 'none'

# Versión inicial de la app; se ajustar durante el ciclo de releases.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Gestion de estado simple para exponer eventos de reproduccion.
  provider: ^6.0.5
  # Registro de dependencias con inyeccion perezosa.
  get_it: ^9.0.5
  # Acceso a GPS y autorizaciones de ubicacion.
  geolocator: ^14.0.2
  # Ejecuta el caso de uso en segundo plano (Android).
  workmanager: ^0.9.0+3
  # Reproduccion de audio local y remoto.
  just_audio: ^0.10.5
  # Base de datos SQLite embebida.
  sqflite: ^2.3.3+1
  # Utilidades de rutas para la base de datos.
  path: ^1.9.0
  # Obtiene directorios seguros para persistencia local.
  path_provider: ^2.1.4
  # Persistencia sencilla para settings de depuración (LocationConfig)
  shared_preferences: ^2.1.0
  # Selector de archivos para importar BD
  file_picker: ^8.1.4

  # Iconos iOS opcionales; util si se crean vistas estilo Cupertino.
  cupertino_icons: ^1.0.8
  # Map rendering (lightweight, no native API keys required).
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.14.0
  record: ^6.1.2
  permission_handler: ^12.0.1
  uuid: ^4.4.2
  geofence_service: ^6.0.0+1
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lints predeterminadas para mantener estilo consistente.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"   # pon aquí tu imagen base 1024x1024
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Directorio donde se almacenan los audios precargados.
  assets:
    - assets/audio/
